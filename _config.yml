title: Alvaro Wisky
email: alvarowisky@hotmail.com
description: >-
  Atendimento psicanalítico individual, terapia para casais, acompanhamento de adolescentes
  e sessões de autoconhecimento em São Bernardo do Campo. Oferecemos também fisioterapia
  e acupuntura com abordagem integrativa. Cuidado personalizado para seu bem-estar físico,
  mental e emocional. Sessões confidenciais com profissional experiente em psicanálise,
  psicologia clínica e medicina tradicional chinesa.
baseurl: ''
url: 'https://alvarowisky.github.io'
lang: pt-BR

# SEO settings
author:
  name: Alvaro Wisky
  email: alvarowisky@hotmail.com

# Social sharing
