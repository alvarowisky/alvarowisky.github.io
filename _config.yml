  name: Alvaro Wisky
  links:
    - https://www.linkedin.com/in/alvaro-wisky/
    - https://www.instagram.com/alvarowisky/

# Open Graph
logo: /assets/img/profile-img.jpeg

# SEO keywords (aparecerá como meta keywords)
